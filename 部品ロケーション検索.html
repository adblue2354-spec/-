<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>部品ロケーション検索</title>
<style>
  :root{
    --chrome:#2b2e33;
    --chrome-2:#35383e;
    --chrome-line:#44474d;
    --paper:#ffffff;
    --paper-2:#f4f5f6;
    --ink:#1c1e21;
    --ink-2:#6b6f76;
    --red:#d3222a;
    --red-dark:#a81920;
    --amber:#e8a33d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--chrome);
    color:var(--ink);
    font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,-apple-system,sans-serif;
    overscroll-behavior-y:none;
  }

  /* ===== App shell ===== */
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper-2);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ===== Header (chrome) ===== */
  header.topbar{
    background:#ffffff;
    color:#1c1e21;
    padding:14px 16px 12px;
    position:sticky;
    top:0;
    z-index:30;
    border-bottom:3px solid var(--red);
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
  }
  .brand .mitsubishi-mark{
    display:block;
    flex-shrink:0;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));
  }
  .brand .logo-plate{
    display:flex;
    align-items:center;
  }
  .brand .logo-plate img{
    display:block;
    height:28px;
    width:auto;
  }
  .brand h1{
    font-size:15px;
    font-weight:700;
    margin:0;
    letter-spacing:.02em;
    color:#3a3d42;
  }
  .header-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .count-pill{
    background:#f0f1f2;
    border:1px solid #dcdde0;
    color:#5a5d63;
    font-size:11.5px;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .count-pill b{color:#1c1e21;}
  .icon-btn{
    width:30px;height:30px;
    border-radius:8px;
    background:#f0f1f2;
    border:1px solid #dcdde0;
    color:#3a3d42;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .icon-btn svg{width:17px;height:17px;}
  .icon-btn:active{background:#e3e4e6;}

  .search-wrap{
    position:relative;
    margin:10px 0 12px;
  }
  .search-wrap input{
    width:100%;
    background:#1c1e21;
    border:none;
    border-radius:10px;
    padding:11px 40px 11px 38px;
    font-size:15.5px;
    color:#fff;
    outline:none;
  }
  .search-wrap input::placeholder{color:#8b8e94;}
  .search-wrap svg.icon-search{
    position:absolute;
    left:11px;
    top:50%;
    transform:translateY(-50%);
    width:17px;
    height:17px;
    stroke:#8b8e94;
  }
  .clear-btn{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:#e7e8ea;
    color:#6b6f76;
    font-size:14px;
    line-height:1;
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .clear-btn.show{display:flex;}

  /* ===== Filters ===== */
  .filter-zone{
    background:var(--chrome);
    padding:10px 16px 14px;
    position:sticky;
    top:60px;
    z-index:25;
    border-bottom:1px solid var(--chrome-line);
  }
  .filter-label{
    font-size:10.5px;
    color:#9a9ea5;
    letter-spacing:.1em;
    margin:8px 0 6px;
    text-transform:uppercase;
  }
  .filter-label:first-child{margin-top:0;}
  .chip-row{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:2px;
    scrollbar-width:none;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto;
    padding:6px 13px;
    border-radius:999px;
    background:var(--chrome-2);
    border:1px solid var(--chrome-line);
    color:#d6d8db;
    font-size:12.5px;
    cursor:pointer;
    white-space:nowrap;
    transition:background .12s, color .12s, border-color .12s;
    user-select:none;
  }
  .chip.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
    font-weight:700;
  }
  .group-select-wrap{position:relative;}
  select.group-select{
    width:100%;
    appearance:none;
    background:var(--chrome-2);
    border:1px solid var(--chrome-line);
    color:#d6d8db;
    font-size:13px;
    padding:8px 30px 8px 12px;
    border-radius:8px;
    outline:none;
  }
  select.group-select option{background:#2b2e33;color:#fff;}
  .group-select-wrap::after{
    content:"";
    position:absolute;
    right:12px; top:50%;
    width:8px;height:8px;
    border-right:2px solid #9a9ea5;
    border-bottom:2px solid #9a9ea5;
    transform:translateY(-65%) rotate(45deg);
    pointer-events:none;
  }

  /* ===== Results ===== */
  main{
    flex:1;
    padding:14px 12px 90px;
  }
  .empty-state{
    text-align:center;
    padding:70px 20px;
    color:var(--ink-2);
  }
  .empty-state .glyph{
    font-size:34px;
    margin-bottom:10px;
    opacity:.5;
  }
  .empty-state p{margin:2px 0; font-size:13.5px;}

  .group-header{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 4px 7px;
  }
  .group-header:first-child{padding-top:2px;}
  .group-header .bar{
    width:4px;
    height:14px;
    background:var(--red);
    border-radius:2px;
  }
  .group-header .g-name{
    font-size:13px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:.01em;
  }
  .group-header .g-count{
    font-size:11px;
    color:var(--ink-2);
    background:#e9eaeb;
    padding:1.5px 8px;
    border-radius:999px;
    font-weight:600;
  }

  .card{
    background:var(--paper);
    border-radius:12px;
    padding:12px 13px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:12px;
    box-shadow:0 1px 2px rgba(0,0,0,0.06);
    cursor:pointer;
    position:relative;
    border:1px solid #eceded;
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .card:active{transform:scale(0.985);}
  .card.copied{box-shadow:0 0 0 2px var(--red) inset;}

  .loc-badge{
    flex:0 0 auto;
    min-width:58px;
    text-align:center;
    background:var(--red);
    color:#fff;
    font-weight:800;
    font-size:13.5px;
    padding:8px 6px;
    border-radius:8px;
    letter-spacing:.02em;
    line-height:1.15;
  }
  .loc-badge.na{
    background:#e5e6e8;
    color:#8a8e94;
    font-size:10.5px;
    font-weight:700;
  }

  .card-body{
    flex:1;
    min-width:0;
  }
  .part-name{
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:3px;
    overflow-wrap:anywhere;
  }
  .part-name mark{
    background:#ffe8b0;
    color:inherit;
    border-radius:2px;
    padding:0 1px;
  }
  .meta-row{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--ink-2);
  }
  .partno{
    font-family:"SF Mono",Menlo,Consolas,monospace;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .partno mark{background:#ffe8b0;border-radius:2px;}
  .tag{
    background:var(--paper-2);
    border:1px solid #e3e4e6;
    color:#54585f;
    padding:1.5px 7px;
    border-radius:6px;
    font-size:10.5px;
    font-weight:600;
  }
  .tag.engine{color:var(--red-dark); border-color:#f3d0d1; background:#fdf1f1;}

  .copy-hint{
    flex:0 0 auto;
    color:#c7c9cc;
    font-size:16px;
  }

  /* ===== Toast ===== */
  .toast{
    position:fixed;
    left:50%;
    bottom:24px;
    transform:translateX(-50%) translateY(20px);
    background:var(--chrome);
    color:#fff;
    padding:10px 18px;
    border-radius:999px;
    font-size:13px;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s, transform .18s;
    z-index:100;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
    border:1px solid var(--chrome-line);
    max-width:88%;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .toast .dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex:0 0 auto;}

  .section-jump{
    position:fixed;
    right:14px;
    bottom:24px;
    width:42px;
    height:42px;
    border-radius:50%;
    background:var(--chrome);
    color:#fff;
    border:1px solid var(--chrome-line);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    cursor:pointer;
    z-index:40;
  }

  @media (max-width:380px){
    .brand h1{font-size:15.5px;}
  }

  /* ===== card edit button ===== */
  .card-edit-btn{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    background:var(--paper-2);
    border:1px solid #e3e4e6;
    color:#8a8e94;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;
    cursor:pointer;
  }
  .card-edit-btn:active{background:#e7e8ea;}

  .card-copy-btn{
    flex:0 0 auto;
    width:28px;height:28px;
    border-radius:50%;
    background:#fdf1f1;
    border:1px solid #f3d0d1;
    color:var(--red-dark);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .card-copy-btn svg{width:14px;height:14px;}
  .card-copy-btn:active{background:#f7dcdc;}

  .card-actions{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    gap:6px;
  }

  /* ===== FAB ===== */
  .fab{
    position:fixed;
    left:14px;
    bottom:24px;
    width:48px;height:48px;
    border-radius:50%;
    background:var(--red);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;
    font-weight:400;
    box-shadow:0 6px 16px rgba(211,34,42,.45);
    cursor:pointer;
    z-index:40;
    line-height:1;
  }
  .fab:active{background:var(--red-dark);}

  /* ===== Menu overlay / bottom sheet ===== */
  .menu-overlay{
    position:fixed; inset:0;
    background:rgba(20,21,23,.5);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:200;
  }
  .menu-overlay.show{display:flex;}
  .menu-sheet{
    width:100%;
    max-width:640px;
    background:#fff;
    border-radius:16px 16px 0 0;
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));
    animation:slideUp .18s ease;
  }
  @keyframes slideUp{from{transform:translateY(24px);opacity:.5;}to{transform:translateY(0);opacity:1;}}
  .menu-title{
    font-size:12px; color:var(--ink-2); font-weight:700;
    letter-spacing:.06em; padding:10px 6px 4px;
  }
  .menu-item{
    display:flex; align-items:center; gap:12px;
    padding:12px 6px;
    cursor:pointer;
    border-bottom:1px solid #f0f1f2;
  }
  .menu-item span{font-size:19px;}
  .menu-item b{display:block; font-size:14px; color:var(--ink);}
  .menu-item small{display:block; font-size:11.5px; color:var(--ink-2); margin-top:1px;}
  .menu-item.danger b{color:var(--red-dark);}
  .menu-item:last-of-type{border-bottom:none;}
  .menu-cancel{
    text-align:center;
    padding:13px;
    margin-top:6px;
    font-weight:700;
    color:var(--ink-2);
    background:var(--paper-2);
    border-radius:10px;
    cursor:pointer;
  }

  /* ===== Edit modal ===== */
  .edit-sheet{
    width:100%;
    max-width:640px;
    background:#fff;
    border-radius:16px 16px 0 0;
    padding:0 0 calc(10px + env(safe-area-inset-bottom));
    animation:slideUp .18s ease;
    max-height:88vh;
    overflow-y:auto;
  }
  .edit-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 10px;
    font-weight:700; font-size:15px;
    position:sticky; top:0; background:#fff; z-index:2;
    border-bottom:1px solid #f0f1f2;
  }
  .edit-header .icon-btn{background:var(--paper-2); border-color:#e3e4e6; color:#6b6f76;}
  .edit-body{
    padding:14px 16px 4px;
    display:flex; flex-direction:column; gap:12px;
  }
  .edit-body label{
    display:flex; flex-direction:column; gap:5px;
    font-size:12px; color:var(--ink-2); font-weight:600;
  }
  .edit-body input{
    font-size:15px;
    padding:10px 11px;
    border-radius:9px;
    border:1px solid #dcdde0;
    background:var(--paper-2);
    color:var(--ink);
    outline:none;
    font-family:inherit;
  }
  .edit-body input:focus{border-color:var(--red);}
  .quick-group-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:-4px;
  }
  .quick-group-chip{
    padding:5px 11px;
    border-radius:999px;
    background:var(--paper-2);
    border:1px solid #e3e4e6;
    color:#54585f;
    font-size:11.5px;
    font-weight:600;
    cursor:pointer;
  }
  .quick-group-chip.active{
    background:var(--red);
    border-color:var(--red);
    color:#fff;
  }
  .edit-footer{
    display:flex; gap:10px;
    padding:16px;
  }
  .btn-delete, .btn-save{
    flex:1;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-delete{
    background:#fdf1f1;
    color:var(--red-dark);
    display:none;
  }
  .btn-delete.show{display:block;}
  .btn-save{
    background:var(--red);
    color:#fff;
  }
  .btn-save:active{background:var(--red-dark);}
  .btn-delete:active{background:#f7dcdc;}
</style>
</head>

<script>

// ---- API連携 (Google Apps Script / スプレッドシート) ----
const API_URL = 'https://script.google.com/macros/s/AKfycbxd7ninhNYz_dST1h0X94_Uf19gHsz5A2gO5MmshYZxqEJy-BhfXA4WJylA9LJCW2uD/exec';
const STORAGE_KEY = 'fusoPartsLocationData_v1'; // オフライン時の表示用キャッシュ
function makeId(){ return 'p_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }

// スプレッドシートの列名 <-> アプリ内部で使うキー名の変換
function apiItemToLocal(item){
  return {
    id: item.id,
    name: item.partName || '',
    partno: item.partNumber || '',
    loc: item.locationCode || '',
    engine: item.engineType || '',
    group: item.groupName || '',
  };
}
function localToApiItem(d){
  return {
    id: d.id,
    partName: d.name || '',
    partNumber: d.partno || '',
    locationCode: d.loc || '',
    vehicleType: '',
    engineType: d.engine || '',
    groupName: d.group || '',
    memo: '',
  };
}

function loadCache(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return null;
}
function saveCache(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }
  catch(e){}
}

async function apiList(){
  const res = await fetch(API_URL + '?action=list');
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'list failed');
  return data.items.map(apiItemToLocal);
}
async function apiAdd(d){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'add', item: localToApiItem(d) })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'add failed');
  return data.id;
}
async function apiUpdate(d){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'update', item: localToApiItem(d) })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'update failed');
}
async function apiDelete(id){
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({ action:'delete', id })
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'delete failed');
}

let DATA = [];

// ---- Japanese normalization: half<->full width, katakana<->hiragana, case, spaces ----
function normalize(str){
  if(str===null||str===undefined) return '';
  str = String(str);
  str = str.replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0));
  str = str.replace(/　/g, ' ');
  str = str.replace(/[\u30a1-\u30f6]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0x60));
  return str.toLowerCase().trim();
}

let norm = [];
function rebuildNorm(){
  norm = DATA.map(d => ({
    ...d,
    _name: normalize(d.name),
    _partno: normalize(d.partno),
    _loc: normalize(d.loc),
    _engine: normalize(d.engine),
    _group: normalize(d.group),
  }));
}

let state = { q:'', engine:'', group:'' };

const engineChipsEl = document.getElementById('engineChips');
const groupSelectEl = document.getElementById('groupSelect');
const engineListEl = document.getElementById('engineList');
const groupListEl = document.getElementById('groupList');

function getEngineOrder(){
  const order = [];
  DATA.forEach(d => { if(d.engine && !order.includes(d.engine)) order.push(d.engine); });
  return order;
}
function getGroupOrder(){
  const order = [];
  DATA.forEach(d => { if(d.group && !order.includes(d.group)) order.push(d.group); });
  order.sort((a,b)=>a.localeCompare(b,'ja'));
  return order;
}

function renderEngineChips(){
  const engineOrder = getEngineOrder();
  let html = `<div class="chip ${state.engine===''?'active':''}" data-engine="">すべて</div>`;
  engineOrder.forEach(e=>{
    html += `<div class="chip ${state.engine===e?'active':''}" data-engine="${e}">${e}</div>`;
  });
  engineChipsEl.innerHTML = html;
  engineChipsEl.querySelectorAll('.chip').forEach(c=>{
    c.addEventListener('click', ()=>{
      state.engine = c.dataset.engine;
      renderEngineChips();
      render();
    });
  });
}

function renderGroupSelect(){
  const groupOrder = getGroupOrder();
  const current = state.group;
  groupSelectEl.innerHTML = '<option value="">すべてのグループ</option>' +
    groupOrder.map(g=>`<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join('');
  groupSelectEl.value = groupOrder.includes(current) ? current : '';
  if(!groupOrder.includes(current)) state.group = '';
}
groupSelectEl.addEventListener('change', ()=>{
  state.group = groupSelectEl.value;
  render();
});

function renderDatalists(){
  engineListEl.innerHTML = getEngineOrder().map(e=>`<option value="${escapeHtml(e)}">`).join('');
  groupListEl.innerHTML = getGroupOrder().map(g=>`<option value="${escapeHtml(g)}">`).join('');
}

function refreshAll(){
  rebuildNorm();
  renderEngineChips();
  renderGroupSelect();
  renderDatalists();
  render();
}

// ---- Search input ----
const searchInput = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');
searchInput.addEventListener('input', ()=>{
  state.q = searchInput.value;
  clearBtn.classList.toggle('show', state.q.length>0);
  render();
});
clearBtn.addEventListener('click', ()=>{
  searchInput.value=''; state.q=''; clearBtn.classList.remove('show');
  render(); searchInput.focus();
});

function highlight(text, qnorm){
  if(!qnorm) return escapeHtml(text);
  const t = String(text);
  const nt = normalize(t);
  const idx = nt.indexOf(qnorm);
  if(idx === -1) return escapeHtml(t);
  return escapeHtml(t.slice(0,idx)) + '<mark>' + escapeHtml(t.slice(idx, idx+qnorm.length)) + '</mark>' + escapeHtml(t.slice(idx+qnorm.length));
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const resultsEl = document.getElementById('results');
const countNum = document.getElementById('countNum');

function render(){
  const q = normalize(state.q);
  let filtered = norm.filter(d=>{
    if(state.engine && d.engine !== state.engine) return false;
    if(state.group && d.group !== state.group) return false;
    if(q){
      if(!(d._name.includes(q) || d._partno.includes(q) || d._loc.includes(q) || d._engine.includes(q))) return false;
    }
    return true;
  });

  countNum.textContent = filtered.length;

  if(filtered.length===0){
    resultsEl.innerHTML = `<div class="empty-state">
      <div class="glyph">🔍</div>
      <p>該当する部品が見つかりません</p>
      <p>キーワードや絞り込み条件を変えてお試しください</p>
    </div>`;
    return;
  }

  function cardHtml(d){
    const locHtml = d.loc ? highlight(d.loc, q) : '';
    const isNa = !d.loc;
    return `<div class="card" data-id="${escapeHtml(d.id)}" data-copy="${escapeHtml(d.partno)}">
      <div class="loc-badge ${isNa?'na':''}">${isNa ? '未登録' : locHtml}</div>
      <div class="card-body">
        <div class="part-name">${highlight(d.name || '(名称なし)', q)}</div>
        <div class="meta-row">
          <span class="partno">${highlight(d.partno || '—', q)}</span>
          <span class="tag engine">${escapeHtml(d.engine||'—')}</span>
        </div>
      </div>
      <div class="card-actions">
        <div class="card-copy-btn" data-copy="${escapeHtml(d.partno)}" title="部品番号をコピー">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        </div>
        <div class="card-edit-btn" data-id="${escapeHtml(d.id)}">✎</div>
      </div>
    </div>`;
  }

  // グループごとにまとめて表示（グループを絞り込み中は見出し1つのみ）
  const groups = new Map();
  filtered.forEach(d=>{
    const g = d.group || '未分類';
    if(!groups.has(g)) groups.set(g, []);
    groups.get(g).push(d);
  });

  let html = '';
  groups.forEach((items, g)=>{
    html += `<div class="group-header"><span class="bar"></span><span class="g-name">${escapeHtml(g)}</span><span class="g-count">${items.length}</span></div>`;
    html += items.map(cardHtml).join('');
  });
  resultsEl.innerHTML = html;

  resultsEl.querySelectorAll('.card-edit-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      openEditModal(btn.dataset.id);
    });
  });

  resultsEl.querySelectorAll('.card-copy-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      copyToClipboard(btn.dataset.copy);
      const card = btn.closest('.card');
      if(card){ card.classList.add('copied'); setTimeout(()=>card.classList.remove('copied'), 500); }
    });
  });

  resultsEl.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('click', ()=>{
      const text = card.dataset.copy;
      copyToClipboard(text);
      card.classList.add('copied');
      setTimeout(()=>card.classList.remove('copied'), 500);
    });
  });
}

function copyToClipboard(text){
  if(!text){ showToast('部品番号が未登録です'); return; }
  const done = ()=> showToast(`部品番号をコピーしました：${text}`);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  cb();
}

let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toast.classList.remove('show'), 1800);
}

// scroll-to-top button
const appEl = document.getElementById('app');
const scrollBtn = document.getElementById('scrollTopBtn');
window.addEventListener('scroll', ()=>{
  scrollBtn.style.display = window.scrollY > 400 ? 'flex' : 'none';
});
scrollBtn.style.display = 'none';
scrollBtn.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));

// ===================== 追加・編集・削除 =====================
let editingId = null; // null = 新規追加モード

const editOverlay = document.getElementById('editOverlay');
const editTitle = document.getElementById('editTitle');
const fName = document.getElementById('fName');
const fPartno = document.getElementById('fPartno');
const fLoc = document.getElementById('fLoc');
const fEngine = document.getElementById('fEngine');
const fGroup = document.getElementById('fGroup');
const fDelete = document.getElementById('fDelete');
const fSave = document.getElementById('fSave');
const quickGroupRow = document.getElementById('quickGroupRow');

function renderQuickGroupChips(){
  const groups = getGroupOrder();
  quickGroupRow.innerHTML = groups.map(g =>
    `<div class="quick-group-chip ${fGroup.value===g?'active':''}" data-group="${escapeHtml(g)}">${escapeHtml(g)}</div>`
  ).join('');
  quickGroupRow.querySelectorAll('.quick-group-chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      fGroup.value = chip.dataset.group;
      renderQuickGroupChips();
    });
  });
}
fGroup.addEventListener('input', renderQuickGroupChips);

function openEditModal(id){
  editingId = id || null;
  if(editingId){
    const item = DATA.find(d => d.id === editingId);
    if(!item) return;
    editTitle.textContent = '部品を編集';
    fName.value = item.name || '';
    fPartno.value = item.partno || '';
    fLoc.value = item.loc || '';
    fEngine.value = item.engine || '';
    fGroup.value = item.group || '';
    fDelete.classList.add('show');
  } else {
    editTitle.textContent = '新規部品を追加';
    fName.value = ''; fPartno.value = ''; fLoc.value = '';
    fEngine.value = state.engine || '';
    fGroup.value = state.group || '';
    fDelete.classList.remove('show');
  }
  renderQuickGroupChips();
  editOverlay.classList.add('show');
  setTimeout(()=> fName.focus(), 50);
}
function closeEditModal(){
  editOverlay.classList.remove('show');
  editingId = null;
}
document.getElementById('editClose').addEventListener('click', closeEditModal);
editOverlay.addEventListener('click', (e)=>{ if(e.target === editOverlay) closeEditModal(); });

document.getElementById('fabAdd').addEventListener('click', ()=> openEditModal(null));

fSave.addEventListener('click', async ()=>{
  const name = fName.value.trim();
  const partno = fPartno.value.trim();
  const loc = fLoc.value.trim();
  const engine = fEngine.value.trim();
  const group = fGroup.value.trim();

  if(!name && !partno){
    showToast('部品名称または部品番号を入力してください');
    return;
  }

  fSave.disabled = true;
  const originalLabel = fSave.textContent;
  fSave.textContent = '保存中…';
  try{
    if(editingId){
      const item = DATA.find(d => d.id === editingId);
      if(item){
        item.name = name; item.partno = partno; item.loc = loc;
        item.engine = engine; item.group = group;
        await apiUpdate(item);
      }
      showToast('変更を保存しました');
    } else {
      const newItem = { id: makeId(), name, partno, loc, engine, group };
      const newId = await apiAdd(newItem);
      if(newId) newItem.id = newId;
      DATA.unshift(newItem);
      showToast('部品を追加しました');
    }
    saveCache();
    closeEditModal();
    refreshAll();
  }catch(e){
    showToast('保存に失敗しました。通信環境を確認してください');
  }finally{
    fSave.disabled = false;
    fSave.textContent = originalLabel;
  }
});

fDelete.addEventListener('click', async ()=>{
  if(!editingId) return;
  if(!confirm('この部品を削除しますか？')) return;
  const id = editingId;
  fDelete.disabled = true;
  try{
    await apiDelete(id);
    DATA = DATA.filter(d => d.id !== id);
    saveCache();
    showToast('削除しました');
    closeEditModal();
    refreshAll();
  }catch(e){
    showToast('削除に失敗しました。通信環境を確認してください');
  }finally{
    fDelete.disabled = false;
  }
});

// ===================== メニュー（エクスポート／インポート／リセット） =====================
const menuOverlay = document.getElementById('menuOverlay');
document.getElementById('menuBtn').addEventListener('click', ()=> menuOverlay.classList.add('show'));
document.getElementById('menuCancel').addEventListener('click', ()=> menuOverlay.classList.remove('show'));
menuOverlay.addEventListener('click', (e)=>{ if(e.target === menuOverlay) menuOverlay.classList.remove('show'); });

document.getElementById('menuExport').addEventListener('click', ()=>{
  const exportData = DATA.map(({id, ...rest}) => rest);
  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `部品ロケーション_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  menuOverlay.classList.remove('show');
  showToast('JSONファイルを書き出しました');
});

const importFile = document.getElementById('importFile');
document.getElementById('menuImport').addEventListener('click', ()=>{
  menuOverlay.classList.remove('show');
  importFile.value = '';
  importFile.click();
});
importFile.addEventListener('change', ()=>{
  const file = importFile.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!Array.isArray(parsed)) throw new Error('not array');
      const cleaned = parsed.map(d => ({
        name: d.name || '',
        partno: d.partno || '',
        loc: d.loc || '',
        engine: d.engine || '',
        group: d.group || '',
      }));
      if(!confirm(`${cleaned.length}件のデータをスプレッドシートに追加します。よろしいですか？`)) return;
      showToast(`${cleaned.length}件を追加中…`);
      for(const d of cleaned){
        await apiAdd(d);
      }
      const items = await apiList();
      DATA = items;
      saveCache();
      state = { q:'', engine:'', group:'' };
      searchInput.value = '';
      clearBtn.classList.remove('show');
      refreshAll();
      showToast('インポートが完了しました');
    }catch(e){
      showToast('インポートに失敗しました。通信環境を確認してください');
    }
  };
  reader.readAsText(file);
});

document.getElementById('menuReset').addEventListener('click', async ()=>{
  menuOverlay.classList.remove('show');
  if(!confirm('スプレッドシートの最新データに再読込しますか？（この端末だけの未保存の変更は失われます）')) return;
  showToast('再読込中…');
  try{
    const items = await apiList();
    DATA = items;
    saveCache();
    state = { q:'', engine:'', group:'' };
    searchInput.value = '';
    clearBtn.classList.remove('show');
    refreshAll();
    showToast('最新データに更新しました');
  }catch(e){
    showToast('再読込に失敗しました。通信環境を確認してください');
  }
});

async function initApp(){
  const cached = loadCache();
  if(cached && cached.length){
    DATA = cached;
    refreshAll();
  } else {
    resultsEl.innerHTML = `<div class="empty-state">
      <div class="glyph">⏳</div>
      <p>データを読み込み中…</p>
    </div>`;
  }
  try{
    const items = await apiList();
    DATA = items;
    saveCache();
    refreshAll();
  }catch(e){
    if(!cached || !cached.length){
      resultsEl.innerHTML = `<div class="empty-state">
        <div class="glyph">⚠️</div>
        <p>データの取得に失敗しました</p>
        <p>通信環境を確認し、右上のメニューから再読込してください</p>
      </div>`;
    } else {
      showToast('最新データの取得に失敗しました（前回のデータを表示中）');
    }
  }
}
initApp();
